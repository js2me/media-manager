name: Build and release
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build Linux packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y squashfs-tools xdotool xvfb dbus-x11
          bash packaging/build-linux.sh
          sudo apt-get install -y ./dist/packages/*.deb
      - run: /usr/bin/python3 -m unittest discover -s tests
      - name: Launch both packages
        run: |
          for package in /usr/bin/media-manager dist/packages/*.AppImage; do
            APPIMAGE_EXTRACT_AND_RUN=1 timeout 60s dbus-run-session -- xvfb-run -a bash -ec '
              "$1" &
              pid=$!
              trap "kill $pid 2>/dev/null || true" EXIT
              xdotool search --sync --onlyvisible --name "^Photo Library$"
            ' smoke "$package"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: linux-amd64
          path: dist/packages/
          if-no-files-found: error

  release:
    needs: linux
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-amd64
          path: packages
      - name: Publish release
        run: |
          version=$(node -p 'require("./package.json").version')
          tag="v${version}-build.${GITHUB_RUN_NUMBER}"
          cd packages
          sha256sum -- *.AppImage *.deb > SHA256SUMS.txt
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" ./*.AppImage ./*.deb SHA256SUMS.txt --clobber
          else
            gh release create "$tag" ./*.AppImage ./*.deb SHA256SUMS.txt \
              --target "$GITHUB_SHA" --title "Media Manager ${version} · build ${GITHUB_RUN_NUMBER}" \
              --generate-notes --latest
          fi
